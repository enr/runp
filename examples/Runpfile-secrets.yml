name: secrets example
description: |
  Demonstrates encrypted secrets in SSH tunnel units (RNP-014, RNP-017).

  SETUP — generate an encrypted secret:
    # Recommended (key from env var, secret piped via stdin — RNP-014):
    export RUNP_KEY=my-test-key
    echo "my-ssh-password" | runp encrypt --key-env RUNP_KEY
    # Copy the "Encrypted secret: ..." value into encrypted_secret below.

    # Alternative with random key (prints both key and ciphertext):
    runp encrypt my-ssh-password

    # Avoid this — key visible in ps aux and shell history (RNP-017):
    runp encrypt --key my-test-key my-ssh-password

  USAGE — run with the decryption key:
    export RUNP_KEY=my-test-key
    runp up --file examples/Runpfile-secrets.yml --key-env RUNP_KEY --dry-run

  DRY RUN to verify setup without connecting:
    runp up --file examples/Runpfile-secrets.yml --key-env RUNP_KEY --dry-run

units:
  app:
    description: Application that needs the remote service via tunnel
    depends_on: [remote-service]
    host:
      command: echo "app connected through tunnel"

  remote-service:
    description: SSH tunnel to remote service using an encrypted password
    ssh_tunnel:
      user: ops
      auth:
        # Replace with the output of: echo "password" | runp encrypt --key-env RUNP_KEY
        encrypted_secret: "REPLACE_WITH_ENCRYPTED_VALUE"
      local:
        port: 8888
      jump:
        host: bastion.example.com
        port: 22
      target:
        host: internal.example.com
        port: 8888
